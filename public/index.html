<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gratidude: Coming soon.</title>
  <meta name="description" content="Gratidude is an AI-powered gratitude journal for people who hate that sorta stuff. Coming soon. Sign up for the prelaunch.">
  <meta name="theme-color" content="#0B0B0B">
  <link rel="canonical" href="https://gratidude.ai/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=JetBrains+Mono:wght@400&family=Archivo:wght@400&display=swap" rel="stylesheet">
  <style>
    /* Holding page. Same drill-sergeant look as the retired app (archive/public/style.css):
       black ground, Oswald caps, one signal yellow, no radius, no shadows. */
    :root {
      --ink: #0B0B0B;
      --bone: #F2F1EC;
      --bone-faint: #8A8884;
      --placeholder: #78766F;
      --rule: #2A2A28;
      --signal: #FFD400;
      --display: 'Oswald', Impact, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
      --body: 'Archivo', Helvetica, Arial, sans-serif;
      --track: .06em;
      --pad-x: clamp(16px, 4vw, 64px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body { background: var(--ink); color: var(--bone); font-family: var(--body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    :focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }

    main {
      min-height: 100vh; min-height: 100svh;
      display: flex; flex-direction: column;
      padding: clamp(14px, 4vw, 46px) var(--pad-x) calc(clamp(40px, 6vw, 64px) + env(safe-area-inset-bottom));
    }
    .wordmark { font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: 17px; }

    .core {
      flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
      gap: clamp(28px, 4vw, 48px); padding: clamp(24px, 5vh, 64px) 0; max-width: 1400px;
    }
    h1 {
      font-family: var(--display); font-weight: 700; text-transform: uppercase;
      line-height: .94; letter-spacing: -.005em; font-size: clamp(36px, 5.6vw, 88px);
      max-width: 20ch; text-wrap: balance;
    }
    h1 .dim { color: var(--bone-faint); }
    .stamp {
      font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
      font-size: clamp(14px, 1.3vw, 18px); color: var(--signal);
      box-shadow: inset 0 0 0 2px var(--signal); padding: 8px 14px; transform: rotate(-3deg);
    }

    form { width: 100%; max-width: 640px; }
    .signup { display: flex; flex-wrap: wrap; gap: 12px; }
    .signup input {
      flex: 1 1 240px; min-width: 0; background: none; border: 1px solid var(--rule); border-radius: 0;
      color: var(--bone); font-family: var(--body); font-size: 16px; padding: 14px; outline: none;
    }
    .signup input:focus { border-color: var(--signal); }
    .signup input::placeholder { color: var(--placeholder); opacity: 1; }
    .btn {
      flex: 0 0 auto; font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
      font-size: clamp(15px, 1.3vw, 18px); background: var(--signal); color: var(--ink); border: 0; border-radius: 0;
      padding: 14px clamp(20px, 2.4vw, 32px); cursor: pointer; transition: transform .08s steps(2);
    }
    .btn:active { transform: translateY(2px); }
    .btn:disabled { opacity: .5; cursor: default; transform: none; }
    .status { font-family: var(--mono); font-size: 14px; letter-spacing: var(--track); text-transform: uppercase; color: var(--bone-faint); margin-top: 14px; }
    .status.ok { color: var(--signal); margin-top: 0; }
    @media (max-width: 520px) { .btn { flex: 1 1 100%; } }
  </style>
</head>
<body>
<main>
  <span class="wordmark">Gratidude</span>
  <div class="core">
    <h1>Gratidude is an AI-powered gratitude journal <span class="dim">for people who hate that sorta stuff.</span></h1>
    <p class="stamp">Coming soon.</p>

    <!-- Netlify Forms: sign-ups land in the Netlify dashboard under Forms → prelaunch. -->
    <form name="prelaunch" method="POST" data-netlify="true" netlify-honeypot="company" id="signup">
      <input type="hidden" name="form-name" value="prelaunch">
      <p hidden><label>Leave this empty <input name="company" tabindex="-1" autocomplete="off"></label></p>
      <div class="signup">
        <input name="email" type="email" required placeholder="you@example.com" autocomplete="email" inputmode="email" aria-label="Email">
        <button class="btn" type="submit">Sign up for the prelaunch</button>
      </div>
      <p class="status" role="status" hidden></p>
    </form>
  </div>
</main>

<script>
  // Submit in place so people stay on the page. Without JS the form still posts to Netlify normally.
  const form = document.getElementById('signup');
  const status = form.querySelector('.status');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button');
    btn.disabled = true;
    try {
      const res = await fetch('/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams(new FormData(form)).toString(),
      });
      if (!res.ok) throw new Error(res.status);
      form.querySelector('.signup').hidden = true;
      status.textContent = "You're on the list.";
      status.classList.add('ok');
    } catch {
      status.textContent = "That didn't go through. Try again.";
      btn.disabled = false;
    }
    status.hidden = false;
  });
</script>
</body>
</html>
